services:
  postgres:
    image: postgres:16-alpine
    container_name: eventra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventra_password}
      POSTGRES_DB: ${POSTGRES_DB:-eventra_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventra_user} -d ${POSTGRES_DB:-eventra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  google-maps-scraper:
    image: gosom/google-maps-scraper:latest
    container_name: eventra-google-maps-scraper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  openwa:
    build:
      context: ./tools/openwa
      dockerfile: Dockerfile
    container_name: eventra-openwa
    restart: unless-stopped
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
    volumes:
      - openwa_sessions:/home/node/app
      - ./tools/openwa/cli.config.json:/home/node/app/cli.config.json:ro

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: eventra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eventra_user}:${POSTGRES_PASSWORD:-eventra_password}@postgres:5432/${POSTGRES_DB:-eventra_db}
      - ENVIRONMENT=development
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_MAPS_SCRAPER_URL=${GOOGLE_MAPS_SCRAPER_URL:-http://google-maps-scraper:8080}
      - COMMUNICATION_PROVIDER=${COMMUNICATION_PROVIDER:-mock}
      - OPENWA_ENABLED=${OPENWA_ENABLED:-false}
      - OPENWA_BASE_URL=${OPENWA_BASE_URL:-http://openwa:2785}
      - OPENWA_API_KEY=${OPENWA_API_KEY}
      - OPENWA_SESSION_ID=${OPENWA_SESSION_ID:-eventra_ops}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: eventra-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules

volumes:
  pgdata:
    driver: local
  openwa_sessions:
    driver: local
